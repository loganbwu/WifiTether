<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tethering Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --white: #fff;
  --grey: grey;
  --text: #bbb;
  --pale-blue: #ADD8E6;
  --black: #111;
  --dark: #1a1a1a;
  --border: #333;
  --mid: #555;
}

* { box-sizing: border-box; }

body {
  font-family: Helvetica, sans-serif;
  background: var(--black);
  color: var(--text);
  margin: 0;
  padding: 0 clamp(1rem, 4vw, 4rem);
  min-height: 100vh;
}

h1, h2 {
  font-family: 'Oswald', sans-serif;
  color: var(--white);
  font-weight: 400;
  text-transform: uppercase;
  margin: 0;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 0 16px;
  gap: 16px;
  flex-wrap: wrap;
}

header h1 { font-size: 1.4em; }

#status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--mid);
  display: inline-block;
  margin-right: 6px;
  vertical-align: middle;
}
#status-dot.ok { background: #4caf50; }
#status-dot.warn { background: #ff9800; }

#status-label {
  font-size: 0.8em;
  color: var(--grey);
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  vertical-align: middle;
}

#folder-form {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

#folder-input {
  flex: 1;
  min-width: 240px;
  padding: 10px;
  border: 1px solid var(--mid);
  background: var(--black);
  color: var(--white);
  font-family: Helvetica, sans-serif;
  font-size: 0.95em;
}

#folder-input:focus { outline: 1px solid var(--pale-blue); }

button {
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  font-size: 1em;
  color: var(--black);
  background: var(--pale-blue);
  border: 1px solid var(--pale-blue);
  padding: 10px 20px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

button:hover {
  background: var(--white);
  border-color: var(--white);
}

#photo-count {
  font-size: 0.8em;
  color: var(--grey);
  margin-bottom: 12px;
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
}

#lightroom-form {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

#lightroom-form label {
  font-size: 0.75em;
  color: var(--grey);
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  white-space: nowrap;
}

#lightroom-input {
  flex: 1;
  min-width: 200px;
  padding: 8px 10px;
  border: 1px solid var(--mid);
  background: var(--black);
  color: var(--white);
  font-family: Helvetica, sans-serif;
  font-size: 0.85em;
}

#lightroom-input:focus { outline: 1px solid var(--pale-blue); }

#lightroom-form button {
  padding: 8px 16px;
  font-size: 0.85em;
}

#rating-filter {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 16px;
}

.rating-star {
  background: none;
  border: none;
  color: var(--mid);
  font-size: 1.4em;
  line-height: 1;
  padding: 2px 3px;
  cursor: pointer;
  transition: color 0.15s;
}

.rating-star:hover { color: var(--pale-blue); }
.rating-star.active { color: var(--pale-blue); }

#rating-filter-label {
  font-size: 0.75em;
  color: var(--grey);
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  margin-left: 6px;
}

/* Gallery */
#gallery {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 10px;
  padding-bottom: 40px;
}

.tether-card {
  background: var(--dark);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: border-color 0.15s;
  overflow: hidden;
  position: relative;
}

.tether-card:hover { border-color: var(--pale-blue); }

.tether-card__img-wrap {
  width: 100%;
  background: #0a0a0a;
}

.tether-card__img-wrap img,
.tether-card__img-wrap canvas {
  width: 100%;
  height: auto;
  display: block;
}

.tether-card__badges {
  position: absolute;
  top: 6px; right: 6px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  z-index: 1;
  pointer-events: none;
}

.tether-card__badge {
  font-family: 'Oswald', sans-serif;
  font-size: 0.65em;
  text-transform: uppercase;
  padding: 2px 5px;
  background: rgba(0,0,0,0.7);
  color: var(--pale-blue);
  border: 1px solid var(--pale-blue);
}

.tether-card__error {
  padding: 10px 8px;
  font-size: 0.75em;
  color: #c0a000;
  min-height: 60px;
  display: flex;
  align-items: center;
}

.tether-card__info {
  padding: 5px 8px;
  font-size: 0.72em;
  color: var(--grey);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tether-card--newest .tether-card__info::after {
  content: ' ●';
  color: var(--pale-blue);
}

/* Viewer modal */
#viewer-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 1100;
  align-items: stretch;
  animation: fadeIn 0.15s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.viewer-content {
  display: flex;
  width: 100%;
  max-height: 100vh;
  overflow: hidden;
}

.viewer-canvas-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  padding: 20px;
  background: #0a0a0a;
}

#viewer-canvas {
  max-width: 100%;
  max-height: calc(100vh - 40px);
  object-fit: contain;
  display: block;
}

.viewer-controls {
  width: 280px;
  min-width: 240px;
  background: var(--dark);
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.viewer-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.viewer-header h2 {
  font-size: 1em;
  flex: 1;
}

.viewer-close-btn {
  background: none;
  border: 1px solid var(--mid);
  color: var(--white);
  font-size: 1em;
  padding: 8px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
}

.viewer-close-btn:hover {
  color: var(--pale-blue);
  background: none;
  border-color: var(--pale-blue);
}

.ctrl-label {
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  font-size: 0.8em;
  color: var(--grey);
  margin: 0;
}

.ctrl-overlay-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.select-all-btn {
  background: none;
  border: 1px solid var(--mid);
  color: var(--white);
  font-size: 0.7em;
  padding: 4px 6px;
  cursor: pointer;
}

.select-all-btn:hover {
  color: var(--pale-blue);
  background: none;
  border-color: var(--pale-blue);
}

.overlays-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.overlay-btn {
  display: block;
  width: 100%;
  text-align: left;
  font-size: 0.85em;
  font-family: Helvetica, sans-serif;
  text-transform: none;
  padding: 6px 10px;
  background: transparent;
  color: var(--grey);
  border: 1px solid var(--mid);
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.overlay-btn.active {
  background: var(--pale-blue);
  color: var(--black);
  border-color: var(--pale-blue);
}

.overlay-btn.active.comparing {
  background: transparent;
  color: var(--pale-blue);
  border-color: var(--pale-blue);
}

.ctrl-base-name {
  font-size: 0.85em;
  color: var(--text);
  margin: 0;
  word-break: break-all;
}

.ctrl-instructions {
  font-size: 0.82em;
  color: var(--grey);
  margin: 0;
  line-height: 1.5;
}

@media (max-width: 640px) {
  .viewer-content { flex-direction: column; }
  .viewer-controls { width: 100%; min-width: unset; max-height: 40vh; }
  .viewer-canvas-wrap { flex: 1; min-height: 0; }
}
</style>
</head>
<body>

<header>
  <h1>Tethering Viewer</h1>
  <div>
    <span id="status-dot"></span>
    <span id="status-label">Connecting...</span>
  </div>
</header>

<div id="folder-form">
  <input id="folder-input" type="text" autocomplete="off" spellcheck="false">
  <button id="browse-btn">Browse</button>
  <button id="watch-btn">Watch</button>
</div>

<div id="lightroom-form">
  <label for="lightroom-input">Lightroom catalog (optional)</label>
  <input id="lightroom-input" type="text" autocomplete="off" spellcheck="false" placeholder="~/Pictures/Lightroom/Catalog.lrcat">
  <button id="lightroom-btn">Set</button>
</div>

<div id="rating-filter" role="group" aria-label="Filter by minimum star rating"></div>

<div id="photo-count"></div>
<div id="gallery"></div>

<!-- Viewer modal -->
<div id="viewer-modal" role="dialog" aria-modal="true" aria-label="Multiple exposure viewer">
  <div class="viewer-content">
    <div class="viewer-canvas-wrap">
      <canvas id="viewer-canvas"></canvas>
    </div>
    <div class="viewer-controls">
      <div class="viewer-header">
        <h2 id="viewer-title">Multiple Exposure</h2>
        <button class="viewer-close-btn" id="viewer-close" aria-label="Close viewer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Exit
        </button>
      </div>
      <p class="ctrl-instructions">Hover to preview an overlay; click to enable it. Combine multiple exposures to preview the composite. Use ← → to navigate between series.</p>
      <div id="viewer-overlays-container"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // Viewer state
  // ---------------------------------------------------------------------------
  var TRANSITION_MS = 250;
  var viewerOpen = false;
  var viewerSeries = null;     // currently open series object
  var viewerBaseImg = null;
  var viewerOverlayImgs = [];
  var viewerLoadGen = 0;       // incremented per loadViewerImages call; stale loads check against this
  var viewerSettings = [];     // [{enabled, hovering, suppressComparing, currentAlpha, targetAlpha}]
  var viewerLastFocused = null; // element to restore focus to when the viewer closes
  var viewerZoom = 1;          // pinch/ctrl+wheel zoom level applied to #viewer-canvas
  var animFrameId = null;
  var lastTimestamp = null;

  // Gallery state
  var currentSeries = [];      // last-fetched series array
  var newestFilename = null;   // filename of last-added photo
  var minRating = 0;           // 0 = no filter

  // ---------------------------------------------------------------------------
  // SSE connection
  // ---------------------------------------------------------------------------
  var es = null;

  function connectSSE() {
    if (es) es.close();
    es = new EventSource('/api/stream');

    es.onopen = function () {
      setStatus('ok', 'Connected');
    };

    es.onmessage = function (e) {
      var msg = JSON.parse(e.data);
      if (msg.type === 'connected') {
        setStatus('ok', 'Connected');
      } else if (msg.type === 'folder_changed') {
        setStatus('ok', 'Watching ' + msg.folder.split('/').pop());
        currentSeries = [];
        renderGallery([]);
      } else if (msg.type === 'update') {
        newestFilename = msg.filename;
        fetchAndRender();
      } else if (msg.type === 'metadata_updated') {
        fetchAndRender(true);
      }
    };

    es.onerror = function () {
      setStatus('warn', 'Disconnected — retrying...');
      // EventSource retries automatically
    };
  }

  function setStatus(state, label) {
    document.getElementById('status-dot').className = state;
    document.getElementById('status-label').textContent = label;
  }

  // ---------------------------------------------------------------------------
  // API helpers
  // ---------------------------------------------------------------------------
  var fetchTimer = null;
  var fetchSeq = 0;   // guards against an older in-flight request resolving after a newer one
  function fetchAndRender(skipJump) {
    clearTimeout(fetchTimer);
    fetchTimer = setTimeout(function () {
      var mySeq = ++fetchSeq;
      var url = '/api/series' + (minRating > 0 ? '?min_rating=' + minRating : '');
      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (series) {
          if (mySeq !== fetchSeq) return;   // a newer request has already resolved; discard
          currentSeries = series;
          renderGallery(series);
          if (!skipJump && viewerOpen && newestFilename) {
            jumpToNewest(series);
          }
        })
        .catch(function (err) { console.error('fetch series:', err); });
    }, 50);
  }

  function previewUrl(filename) {
    return '/api/preview/' + encodeURIComponent(filename);
  }

  function photoUrl(filename) {
    return '/api/photo/' + encodeURIComponent(filename);
  }

  // ---------------------------------------------------------------------------
  // Gallery rendering
  // ---------------------------------------------------------------------------
  function renderGallery(series) {
    var gallery = document.getElementById('gallery');
    var totalPhotos = series.reduce(function (n, s) { return n + 1 + s.overlays.length; }, 0);
    document.getElementById('photo-count').textContent =
      totalPhotos === 0 ? '' : totalPhotos + ' photo' + (totalPhotos !== 1 ? 's' : '');

    // Build flat card list, one per series (overlays don't get their own card)
    var cards = series.map(function (s, si) {
      return { seriesIdx: si, overlayIdx: -1, filename: s.base.filename };
    });

    // Pool existing DOM nodes by filename so we can reuse them in any order
    var pool = {};
    Array.from(gallery.children).forEach(function (el) {
      pool[el.dataset.filename] = el;
    });

    gallery.innerHTML = '';
    var newNewestEl = null;

    cards.forEach(function (c) {
      var s = series[c.seriesIdx];
      var isNewest = s.base.filename === newestFilename ||
        s.overlays.some(function (ov) { return ov.filename === newestFilename; });
      var card = pool[c.filename] || createCard(c, s);
      updateCardOverlays(card, s);
      card.classList.toggle('tether-card--newest', isNewest);
      if (isNewest) newNewestEl = card;
      gallery.appendChild(card);
    });

    layoutGallery();

    if (newNewestEl) {
      newNewestEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  var GAP = 10;
  var TARGET_AREA = 40000;
  var TARGET_AREA_MIN = 5000;
  var TARGET_AREA_MAX = 400000;

  // Listen on the whole document, not just #gallery, so a pinch gesture
  // resizes thumbnails regardless of where the cursor happens to be —
  // otherwise the browser's native page-zoom kicks in outside the gallery.
  // Skipped while the viewer modal is open, which handles its own zoom below.
  document.addEventListener('wheel', function (e) {
    if (!e.ctrlKey || viewerOpen) return;
    e.preventDefault();
    TARGET_AREA = Math.min(TARGET_AREA_MAX, Math.max(TARGET_AREA_MIN,
      TARGET_AREA * Math.pow(1.05, -e.deltaY)
    ));
    layoutGallery();
  }, { passive: false });

  function layoutGallery() {
    var gallery = document.getElementById('gallery');
    var containerWidth = gallery.clientWidth;
    if (!containerWidth) return;
    var cards = Array.from(gallery.children);
    if (!cards.length) return;

    var naturalWidths = cards.map(function (card) {
      return Math.sqrt(TARGET_AREA * (parseFloat(card.dataset.aspect) || 1.5));
    });

    // Greedy row packing
    var rows = [];
    var row = [];
    var rowWidth = 0;
    cards.forEach(function (card, i) {
      var w = naturalWidths[i];
      var needed = rowWidth + (row.length ? GAP : 0) + w;
      if (row.length && needed > containerWidth) {
        rows.push(row);
        row = [i];
        rowWidth = w;
      } else {
        row.push(i);
        rowWidth = needed;
      }
    });
    if (row.length) rows.push(row);

    // Apply widths — scale full rows to fill container, leave last row natural
    rows.forEach(function (r, ri) {
      var isLast = ri === rows.length - 1;
      var totalNatural = r.reduce(function (s, i) { return s + naturalWidths[i]; }, 0);
      var scale = isLast ? 1 : (containerWidth - (r.length - 1) * GAP) / totalNatural;
      r.forEach(function (i) {
        cards[i].style.width = Math.floor(naturalWidths[i] * scale) + 'px';
      });
    });
  }

  function cardAriaLabel(s) {
    var count = s.overlays.length;
    return s.base.filename + (count > 0 ? ', ' + count + ' overlay' + (count !== 1 ? 's' : '') : '');
  }

  function createCard(c, s) {
    var card = document.createElement('div');
    card.className = 'tether-card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', cardAriaLabel(s));
    card.dataset.filename = c.filename;
    card.dataset.baseFilename = s.base.filename;
    card.dataset.overlayIdx = String(c.overlayIdx);
    var photo = c.overlayIdx === -1 ? s.base : s.overlays[c.overlayIdx];
    card.dataset.aspect = String(photo.aspect || 1.5);

    var wrap = document.createElement('div');
    wrap.className = 'tether-card__img-wrap';

    if (photo.error) {
      var errEl = document.createElement('div');
      errEl.className = 'tether-card__error';
      errEl.textContent = photo.error;
      wrap.appendChild(errEl);
    } else {
      var badges = document.createElement('div');
      badges.className = 'tether-card__badges';
      wrap.appendChild(badges);
      if (c.overlayIdx === -1 && s.base.flash) {
        var badge = document.createElement('div');
        badge.className = 'tether-card__badge';
        badge.textContent = '↯';
        badges.appendChild(badge);
      }
      var canvas = document.createElement('canvas');
      canvas.setAttribute('aria-hidden', 'true');
      wrap.appendChild(canvas);
    }

    var info = document.createElement('div');
    info.className = 'tether-card__info';
    info.textContent = c.filename;

    card.appendChild(wrap);
    card.appendChild(info);

    card.addEventListener('click', function () {
      var baseFilename = this.dataset.baseFilename;
      var oi = parseInt(this.dataset.overlayIdx, 10);
      var entry = currentSeries.find(function (s) { return s.base.filename === baseFilename; });
      if (entry) openViewer(entry, oi === -1 ? null : oi);
    });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') this.click();
    });

    return card;
  }

  function cardVersion(s) {
    var parts = [s.overlays.length, s.base.mtime];
    s.overlays.forEach(function (ov) { parts.push(ov.mtime); });
    return parts.join(':');
  }

  // Screen-blends the base with its overlays on a canvas, client-side — same
  // technique the full-size viewer already uses for live overlay toggling,
  // just applied once per card instead of interactively. A series with more
  // overlays than MAX_ACTIVE_OVERLAYS continuously rotates through a random
  // subset instead of showing (and loading) all of them at once.
  var MAX_ACTIVE_OVERLAYS = 3;
  var CARD_ROTATION_MS = 3000;
  var cardAnimations = new Map();   // canvas -> rotation state, driven by tickCardAnimations

  function renderCardThumbnail(canvas, s) {
    var myGen = (canvas._thumbGen = (canvas._thumbGen || 0) + 1);
    cardAnimations.delete(canvas);   // stop any prior rotation before rebuilding

    var photos = [s.base].concat(s.overlays);
    var srcs = photos.map(function (p) { return previewUrl(p.filename) + '?v=' + encodeURIComponent(p.mtime); });
    var imgs = srcs.map(function () { return new Image(); });
    var loaded = 0;

    function allLoaded() {
      if (canvas._thumbGen !== myGen) return;   // a newer render has superseded this one
      var base = imgs[0];
      if (!base.complete || !base.naturalWidth) return;
      canvas.width = base.naturalWidth;
      canvas.height = base.naturalHeight;

      if (s.overlays.length > MAX_ACTIVE_OVERLAYS) {
        startCardRotation(canvas, imgs);
      } else {
        drawStaticComposite(canvas, imgs);
      }
    }

    imgs.forEach(function (img, idx) {
      img.onload = function () { loaded++; if (loaded === srcs.length) allLoaded(); };
      img.onerror = function () { loaded++; if (loaded === srcs.length) allLoaded(); };
      img.src = srcs[idx];
    });
  }

  function drawStaticComposite(canvas, imgs) {
    var ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(imgs[0], 0, 0, canvas.width, canvas.height);
    for (var i = 1; i < imgs.length; i++) {
      if (!imgs[i].complete || !imgs[i].naturalWidth) continue;
      ctx.globalCompositeOperation = 'screen';
      ctx.drawImage(imgs[i], 0, 0, canvas.width, canvas.height);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // imgs[0] is the base; imgs[1..] correspond 1:1 with the series' overlays.
  function startCardRotation(canvas, imgs) {
    var activeIndices = [];
    for (var i = 1; i < Math.min(imgs.length, 1 + MAX_ACTIVE_OVERLAYS); i++) activeIndices.push(i);
    var state = { imgs: imgs, activeIndices: activeIndices, transition: null };
    beginNextCardTransition(state);
    cardAnimations.set(canvas, state);
  }

  function beginNextCardTransition(state) {
    var pool = [];
    for (var i = 1; i < state.imgs.length; i++) {
      if (state.activeIndices.indexOf(i) === -1) pool.push(i);
    }
    if (pool.length === 0) { state.transition = null; return; }
    state.transition = {
      outIdx: state.activeIndices[0],                        // oldest active overlay retires
      inIdx: pool[Math.floor(Math.random() * pool.length)],   // random replacement
      startTime: null,
    };
  }

  function drawRotatingCard(canvas, state, progress) {
    var ctx = canvas.getContext('2d');
    var t = state.transition;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(state.imgs[0], 0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'screen';
    state.activeIndices.forEach(function (idx) {
      if (idx === t.outIdx) return;   // drawn separately below with its fading alpha
      var img = state.imgs[idx];
      if (img.complete && img.naturalWidth) {
        ctx.globalAlpha = 1;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }
    });
    var outImg = state.imgs[t.outIdx];
    if (outImg.complete && outImg.naturalWidth) {
      ctx.globalAlpha = 1 - progress;
      ctx.drawImage(outImg, 0, 0, canvas.width, canvas.height);
    }
    var inImg = state.imgs[t.inIdx];
    if (inImg.complete && inImg.naturalWidth) {
      ctx.globalAlpha = progress;
      ctx.drawImage(inImg, 0, 0, canvas.width, canvas.height);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function tickCardAnimations(timestamp) {
    cardAnimations.forEach(function (state, canvas) {
      if (!canvas.isConnected) { cardAnimations.delete(canvas); return; }
      if (!state.transition) return;
      if (state.transition.startTime === null) state.transition.startTime = timestamp;
      var progress = Math.min(1, (timestamp - state.transition.startTime) / CARD_ROTATION_MS);
      drawRotatingCard(canvas, state, progress);
      if (progress >= 1) {
        var doneIdx = state.activeIndices.indexOf(state.transition.outIdx);
        if (doneIdx !== -1) state.activeIndices.splice(doneIdx, 1);
        state.activeIndices.push(state.transition.inIdx);
        beginNextCardTransition(state);
      }
    });
    requestAnimationFrame(tickCardAnimations);
  }
  requestAnimationFrame(tickCardAnimations);

  // Refresh a card's thumbnail (composited client-side with its overlays) and
  // count badge whenever the overlay count, or any involved photo's own
  // content (re-exported/edited in place, e.g. from Lightroom), has changed.
  function updateCardOverlays(card, s) {
    if (s.base.error) return;
    var count = s.overlays.length;
    var version = cardVersion(s);
    if (card.dataset.version === version) return;
    card.dataset.version = version;
    card.setAttribute('aria-label', cardAriaLabel(s));

    var badges = card.querySelector('.tether-card__badges');
    var countBadge = badges.querySelector('.tether-card__badge--count');
    if (count > 0) {
      if (!countBadge) {
        countBadge = document.createElement('div');
        countBadge.className = 'tether-card__badge tether-card__badge--count';
        badges.appendChild(countBadge);
      }
      countBadge.textContent = '+' + count;
    } else if (countBadge) {
      countBadge.remove();
    }

    var canvas = card.querySelector('.tether-card__img-wrap canvas');
    if (canvas) renderCardThumbnail(canvas, s);
  }

  // ---------------------------------------------------------------------------
  // Viewer
  // ---------------------------------------------------------------------------
  function openViewer(series, overlayIdx, enableAll) {
    if (!viewerOpen) {
      viewerLastFocused = document.activeElement;
    }
    viewerOpen = true;
    viewerSeries = series;
    viewerBaseImg = null;
    viewerOverlayImgs = [];
    setViewerZoom(1);
    viewerSettings = series.overlays.map(function (_, i) {
      var on = enableAll ? true : (i === overlayIdx);
      return {
        enabled: on,
        hovering: false,
        suppressComparing: on,
        currentAlpha: on ? 1 : 0,
        targetAlpha: on ? 1 : 0,
      };
    });

    document.getElementById('viewer-title').textContent = series.base.filename.replace(/\.[^.]+$/, '');
    document.getElementById('viewer-modal').style.display = 'flex';
    document.body.style.overflow = 'hidden';

    renderViewerControls(series);
    loadViewerImages(series);
    // Deferred: moving focus synchronously here (e.g. while still inside the
    // keydown handler for Enter/Space on the triggering card) can cause the
    // browser's native "Enter activates the focused button" behaviour to
    // immediately fire on the close button, closing the viewer it just opened.
    setTimeout(function () {
      document.getElementById('viewer-close').focus();
    }, 0);
  }

  function closeViewer() {
    viewerOpen = false;
    viewerSeries = null;
    viewerBaseImg = null;
    viewerOverlayImgs = [];
    viewerLoadGen++;   // discard any in-flight image loads from the closed series
    if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
    document.getElementById('viewer-modal').style.display = 'none';
    document.body.style.overflow = '';
    if (viewerLastFocused && typeof viewerLastFocused.focus === 'function') {
      viewerLastFocused.focus();
    }
    viewerLastFocused = null;
  }

  function navigateSeries(delta) {
    if (!currentSeries.length || !viewerSeries) return;
    var idx = currentSeries.findIndex(function (s) { return s.base.filename === viewerSeries.base.filename; });
    if (idx === -1) return;
    var newIdx = idx + delta;
    if (newIdx < 0 || newIdx >= currentSeries.length) return;
    var s = currentSeries[newIdx];
    openViewer(s, s.overlays.length > 0 ? s.overlays.length - 1 : null);
  }

  function jumpToNewest(series) {
    if (!series.length) return;
    var last = series[series.length - 1];

    // New overlay on the series currently open: disable previous overlays, enable only the new one
    if (viewerSeries && viewerSeries.base.filename === last.base.filename) {
      var prevCount = viewerSettings.length;
      var newCount = last.overlays.length;
      if (newCount > prevCount) {
        viewerSeries = last;
        viewerSettings.forEach(function (s) { s.enabled = false; s.suppressComparing = false; s.targetAlpha = 0; });
        for (var i = prevCount; i < newCount; i++) {
          var on = (i === newCount - 1);
          viewerSettings.push({ enabled: on, hovering: false, suppressComparing: on, currentAlpha: 0, targetAlpha: on ? 1 : 0 });
        }
        renderViewerControls(last);
        loadViewerImages(last);
        return;
      }
    }

    // New series or overlay on a different series: jump there, enable only the last overlay
    openViewer(last, last.overlays.length > 0 ? last.overlays.length - 1 : null);
  }

  function renderViewerControls(series) {
    var container = document.getElementById('viewer-overlays-container');
    container.innerHTML = '';

    var baseLabel = document.createElement('p');
    baseLabel.className = 'ctrl-label';
    baseLabel.textContent = 'Base';
    container.appendChild(baseLabel);

    var baseName = document.createElement('p');
    baseName.className = 'ctrl-base-name';
    baseName.textContent = series.base.filename;
    container.appendChild(baseName);

    if (series.overlays.length === 0) return;

    var row = document.createElement('div');
    row.className = 'ctrl-overlay-row';

    var ovLabel = document.createElement('p');
    ovLabel.className = 'ctrl-label';
    ovLabel.textContent = 'Overlays';

    var selectAllBtn = document.createElement('button');
    selectAllBtn.className = 'select-all-btn';
    selectAllBtn.textContent = 'Select all';

    row.appendChild(ovLabel);
    row.appendChild(selectAllBtn);
    container.appendChild(row);

    var list = document.createElement('div');
    list.className = 'overlays-list';

    var btns = [];
    series.overlays.forEach(function (ov, i) {
      var btn = document.createElement('button');
      btn.className = 'overlay-btn' + (viewerSettings[i].enabled ? ' active' : '');
      btn.setAttribute('aria-pressed', String(viewerSettings[i].enabled));
      btn.textContent = ov.filename;
      btn.title = ov.filename;
      btns.push(btn);

      (function (idx) {
        btn.addEventListener('pointerenter', function () {
          if (window.matchMedia('(hover: none)').matches) return;
          viewerSettings[idx].hovering = true;
          btn.classList.toggle('comparing', viewerSettings[idx].enabled && !viewerSettings[idx].suppressComparing);
          setTargetAlpha(idx);
        });
        btn.addEventListener('pointerleave', function () {
          if (window.matchMedia('(hover: none)').matches) return;
          viewerSettings[idx].hovering = false;
          viewerSettings[idx].suppressComparing = false;
          btn.classList.remove('comparing');
          setTargetAlpha(idx);
        });
        btn.addEventListener('click', function () {
          viewerSettings[idx].enabled = !viewerSettings[idx].enabled;
          btn.classList.toggle('active', viewerSettings[idx].enabled);
          btn.setAttribute('aria-pressed', String(viewerSettings[idx].enabled));
          if (viewerSettings[idx].enabled) viewerSettings[idx].suppressComparing = true;
          btn.classList.remove('comparing');
          updateSelectAllBtn(selectAllBtn);
          setTargetAlpha(idx);
        });
      }(i));

      list.appendChild(btn);
    });

    selectAllBtn.addEventListener('click', function () {
      var allOn = viewerSettings.every(function (s) { return s.enabled; });
      var enable = !allOn;
      viewerSettings.forEach(function (s, i) {
        s.enabled = enable;
        s.suppressComparing = enable;
        s.hovering = false;
        btns[i].classList.toggle('active', enable);
        btns[i].setAttribute('aria-pressed', String(enable));
        btns[i].classList.remove('comparing');
        setTargetAlpha(i);
      });
      updateSelectAllBtn(selectAllBtn);
    });

    updateSelectAllBtn(selectAllBtn);
    container.appendChild(list);
  }

  function updateSelectAllBtn(btn) {
    btn.textContent = viewerSettings.every(function (s) { return s.enabled; }) ? 'Deselect all' : 'Select all';
  }

  function loadViewerImages(series) {
    var myGen = ++viewerLoadGen;
    var canvas = document.getElementById('viewer-canvas');
    if (!canvas.width) canvas.width = 400;
    if (!canvas.height) canvas.height = 300;

    var srcs = [photoUrl(series.base.filename)].concat(
      series.overlays.map(function (ov) { return photoUrl(ov.filename); })
    );
    var imgs = srcs.map(function () { return new Image(); });
    var loaded = 0;

    imgs.forEach(function (img, idx) {
      function onLoad() {
        if (myGen !== viewerLoadGen) return;   // a newer series has since been opened; discard
        loaded++;
        if (idx === 0) {
          canvas.width = img.naturalWidth || 800;
          canvas.height = img.naturalHeight || 600;
        }
        if (loaded === srcs.length) {
          viewerBaseImg = imgs[0];
          viewerOverlayImgs = imgs.slice(1);
          var needsAnimation = viewerSettings.some(function (s) { return Math.abs(s.targetAlpha - s.currentAlpha) > 0.001; });
          if (needsAnimation) {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            lastTimestamp = null;
            animFrameId = requestAnimationFrame(animationStep);
          } else {
            redraw();
          }
        }
      }
      img.onload = onLoad;
      img.onerror = onLoad;
      img.src = srcs[idx];
    });
  }

  function setTargetAlpha(idx) {
    var s = viewerSettings[idx];
    var effectiveHover = s.hovering && !s.suppressComparing;
    s.targetAlpha = (s.enabled !== effectiveHover) ? 1.0 : 0.0;
    if (animFrameId) cancelAnimationFrame(animFrameId);
    lastTimestamp = null;
    animFrameId = requestAnimationFrame(animationStep);
  }

  function animationStep(ts) {
    var dt = lastTimestamp ? ts - lastTimestamp : 16;
    lastTimestamp = ts;
    var still = false;
    viewerSettings.forEach(function (s) {
      var diff = s.targetAlpha - s.currentAlpha;
      if (Math.abs(diff) > 0.001) {
        s.currentAlpha += (diff > 0 ? 1 : -1) * dt / TRANSITION_MS;
        s.currentAlpha = Math.max(0, Math.min(1, s.currentAlpha));
        still = true;
      } else {
        s.currentAlpha = s.targetAlpha;
      }
    });
    redraw();
    if (still) {
      animFrameId = requestAnimationFrame(animationStep);
    } else {
      animFrameId = null;
      lastTimestamp = null;
    }
  }

  function redraw() {
    if (!viewerBaseImg || !viewerBaseImg.complete) return;
    var canvas = document.getElementById('viewer-canvas');
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(viewerBaseImg, 0, 0, canvas.width, canvas.height);
    viewerSettings.forEach(function (s, i) {
      if (s.currentAlpha <= 0) return;
      if (!viewerOverlayImgs[i] || !viewerOverlayImgs[i].complete) return;
      ctx.globalAlpha = s.currentAlpha;
      ctx.globalCompositeOperation = 'screen';
      ctx.drawImage(viewerOverlayImgs[i], 0, 0, canvas.width, canvas.height);
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  var VIEWER_ZOOM_MIN = 1;
  var VIEWER_ZOOM_MAX = 8;

  function setViewerZoom(zoom) {
    viewerZoom = Math.min(VIEWER_ZOOM_MAX, Math.max(VIEWER_ZOOM_MIN, zoom));
    document.getElementById('viewer-canvas').style.transform = 'scale(' + viewerZoom + ')';
  }

  // Pinch/ctrl+wheel zooms the image itself rather than the browser page.
  document.addEventListener('wheel', function (e) {
    if (!e.ctrlKey || !viewerOpen) return;
    e.preventDefault();
    setViewerZoom(viewerZoom * Math.pow(1.05, -e.deltaY));
  }, { passive: false });

  // ---------------------------------------------------------------------------
  // Folder watch form
  // ---------------------------------------------------------------------------
  document.getElementById('watch-btn').addEventListener('click', watchFolder);
  document.getElementById('folder-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') watchFolder();
  });
  document.getElementById('browse-btn').addEventListener('click', function () {
    fetch('/api/pick-folder')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.path) {
          document.getElementById('folder-input').value = data.path;
          watchFolder();
        }
      })
      .catch(function (err) { setStatus('warn', 'Error: ' + err.message); });
  });

  function watchFolder() {
    var folder = document.getElementById('folder-input').value.trim();
    if (!folder) return;
    fetch('/api/watch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folder: folder }),
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) {
          setStatus('warn', data.error);
        } else {
          setStatus('ok', 'Watching ' + folder.split('/').pop());
        }
      })
      .catch(function (err) { setStatus('warn', 'Error: ' + err.message); });
  }

  // ---------------------------------------------------------------------------
  // Lightroom catalog form
  // ---------------------------------------------------------------------------
  document.getElementById('lightroom-btn').addEventListener('click', setLightroomCatalog);
  document.getElementById('lightroom-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') setLightroomCatalog();
  });

  function setLightroomCatalog() {
    var path = document.getElementById('lightroom-input').value.trim();
    fetch('/api/lightroom-catalog', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path }),
    })
      .then(function (r) { return r.json(); })
      .catch(function (err) { console.error('set lightroom catalog:', err); });
  }

  // ---------------------------------------------------------------------------
  // Star rating filter
  // ---------------------------------------------------------------------------
  function renderRatingFilter() {
    var container = document.getElementById('rating-filter');
    container.innerHTML = '';
    for (var n = 1; n <= 5; n++) {
      var star = document.createElement('button');
      star.type = 'button';
      star.className = 'rating-star' + (n <= minRating ? ' active' : '');
      star.textContent = '★';
      star.setAttribute('aria-label', n + ' star' + (n > 1 ? 's' : '') + ' and up');
      star.dataset.value = String(n);
      star.addEventListener('click', function () {
        var value = parseInt(this.dataset.value, 10);
        minRating = (minRating === value) ? 0 : value;
        renderRatingFilter();
        fetchAndRender(true);
      });
      container.appendChild(star);
    }
    var label = document.createElement('span');
    label.id = 'rating-filter-label';
    label.textContent = minRating > 0 ? (minRating + '+ stars') : 'All photos';
    container.appendChild(label);
  }
  renderRatingFilter();

  // ---------------------------------------------------------------------------
  // Viewer close
  // ---------------------------------------------------------------------------
  document.getElementById('viewer-close').addEventListener('click', closeViewer);
  document.getElementById('viewer-modal').addEventListener('click', function (e) {
    if (e.target === this) closeViewer();
  });
  document.addEventListener('keydown', function (e) {
    if (!viewerOpen) return;
    if (e.key === 'Escape') closeViewer();
    if (e.key === 'ArrowLeft')  { e.preventDefault(); navigateSeries(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); navigateSeries(1); }
  });

  // ---------------------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------------------
  connectSSE();

  // Set folder input placeholder to today's date path
  (function () {
    var now = new Date();
    var year = now.getFullYear();
    var mm = String(now.getMonth() + 1).padStart(2, '0');
    var dd = String(now.getDate()).padStart(2, '0');
    var dateStr = year + '-' + mm + '-' + dd;
    document.getElementById('folder-input').value = '~/Pictures/' + year + '/' + dateStr;
  }());

  // Re-layout on gallery resize (e.g. window resize)
  new ResizeObserver(function () { layoutGallery(); })
    .observe(document.getElementById('gallery'));

  // Check if server has an active folder already (e.g. after page refresh)
  fetch('/api/status')
    .then(function (r) { return r.json(); })
    .then(function (s) {
      if (s.folder) {
        document.getElementById('folder-input').value = s.folder;
        fetchAndRender();
      }
      if (s.lightroom_catalog) {
        document.getElementById('lightroom-input').value = s.lightroom_catalog;
      }
    })
    .catch(function () {});

}());
</script>
</body>
</html>
